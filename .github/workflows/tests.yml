name: Test Suite

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - '**.swift'
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - 'Scripts/**'
      - 'AynaMobile.xcodeproj/**'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**.swift'
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - 'Scripts/**'
      - 'AynaMobile.xcodeproj/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

# One Xcode for every job, so failures never come from mixed toolchains.
env:
  XCODE_APP: /Applications/Xcode_26.2.app

jobs:
  macos_unit_tests:
    name: macOS Unit Tests
    runs-on: macos-26
    # The expanded persistence/concurrency suite can exceed 20 minutes on a
    # cold macOS runner even though it completes locally.
    timeout-minutes: 40
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Select Xcode version
      run: sudo xcode-select -s "$XCODE_APP/Contents/Developer"

    - name: Show Swift version
      run: swift --version

    - name: Clear SPM artifacts cache
      run: rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts

    # Suite-local `.serialized` traits do not isolate unrelated suites that
    # share process-wide preferences, service singletons, and URLProtocol mocks.
    - name: Run unit tests serially
      run: swift test --no-parallel

  # iOS and watchOS compile checks happen in the UI and unit test jobs below, which build the
  # same sources for those platforms with xcodebuild.

  ios_unit_tests:
    name: iOS Unit Tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Select Xcode version
      run: sudo xcode-select -s "$XCODE_APP/Contents/Developer"

    - name: Resolve iOS Simulator
      id: ios_destination
      shell: bash
      run: |
        set -euo pipefail
        destination_id="$(xcrun simctl list devices available | grep "iPhone 17" | tail -1 | grep -oE '[A-F0-9-]{36}' || true)"
        test -n "$destination_id"
        echo "id=$destination_id" >> "$GITHUB_OUTPUT"

    - name: Boot iOS Simulator
      env:
        DEVICE_UDID: ${{ steps.ios_destination.outputs.id }}
      run: |
        xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
        xcrun simctl bootstatus "$DEVICE_UDID" -b

    # Runs the iOS-only suites (IOSChatViewModel*, ConversationExporterIOSTests), which
    # `swift test` on macOS compiles out.
    - name: Run iOS unit tests (with retry)
      env:
        DEVICE_UDID: ${{ steps.ios_destination.outputs.id }}
      run: |
        set -o pipefail
        for attempt in 1 2; do
          echo "Attempt $attempt of 2"
          if xcodebuild \
            -project AynaMobile.xcodeproj \
            -scheme Ayna-iOS \
            -destination "id=$DEVICE_UDID" \
            -destination-timeout 120 \
            -derivedDataPath ./build/ios-unit \
            -configuration Debug \
            -resultBundlePath ./TestResults-iOS-Unit.xcresult \
            -parallel-testing-enabled NO \
            -only-testing:Ayna-iOSTests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test; then
            echo "Tests passed on attempt $attempt"
            break
          fi
          if [ $attempt -lt 2 ]; then
            echo "Tests failed; rebooting the simulator and retrying..."
            rm -rf ./TestResults-iOS-Unit.xcresult
            xcrun simctl shutdown "$DEVICE_UDID" || true
            xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
            xcrun simctl bootstatus "$DEVICE_UDID" -b
          else
            echo "Tests failed after 2 attempts"
            exit 1
          fi
        done

    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: iOS-Unit-TestResults
        path: TestResults-iOS-Unit.xcresult
        retention-days: 7

  watchos_unit_tests:
    name: watchOS Unit Tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Select Xcode version
      run: sudo xcode-select -s "$XCODE_APP/Contents/Developer"

    - name: Resolve watchOS Simulator
      id: watch_destination
      shell: bash
      run: |
        set -euo pipefail

        destination_id="$(
          xcrun simctl list devices available | \
            awk '
              /^-- watchOS 26\./ { compatible_runtime = 1; next }
              /^-- / { compatible_runtime = 0 }
              compatible_runtime && /^[[:space:]]+Apple Watch / { print }
            ' | \
            sed -nE 's/.*\(([[:xdigit:]-]{36})\).*/\1/p' | \
            tail -n 1
        )"
        test -n "$destination_id"
        echo "id=$destination_id" >> "$GITHUB_OUTPUT"

    # A cold watchOS simulator often misses xcodebuild's destination timeout; boot it first.
    - name: Boot watchOS Simulator
      env:
        DEVICE_UDID: ${{ steps.watch_destination.outputs.id }}
      run: |
        xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
        xcrun simctl bootstatus "$DEVICE_UDID" -b

    - name: Run native watchOS unit tests (with retry)
      env:
        DEVICE_UDID: ${{ steps.watch_destination.outputs.id }}
      run: |
        set -o pipefail
        for attempt in 1 2; do
          echo "Attempt $attempt of 2"
          if xcodebuild \
            -project AynaMobile.xcodeproj \
            -scheme Ayna-watchOS \
            -destination "id=$DEVICE_UDID" \
            -destination-timeout 120 \
            -derivedDataPath ./build/watchos-unit \
            -configuration Debug \
            -resultBundlePath ./TestResults-watchOS-Unit.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test; then
            echo "Tests passed on attempt $attempt"
            break
          fi
          if [ $attempt -lt 2 ]; then
            echo "Tests failed; rebooting the simulator and retrying..."
            rm -rf ./TestResults-watchOS-Unit.xcresult
            xcrun simctl shutdown "$DEVICE_UDID" || true
            xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
            xcrun simctl bootstatus "$DEVICE_UDID" -b
          else
            echo "Tests failed after 2 attempts"
            exit 1
          fi
        done

    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: watchOS-Unit-TestResults
        path: TestResults-watchOS-Unit.xcresult
        retention-days: 7

  macos_ui_tests:
    name: macOS UI Tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Select Xcode version
      run: sudo xcode-select -s "$XCODE_APP/Contents/Developer"

    - name: Show Swift version
      run: swift --version

    - name: Clear SPM artifacts cache
      run: rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts

    - name: Build app for UI tests
      env:
        AYNA_SIGNING: adhoc
      run: Scripts/build-app.sh debug

    - name: Install app
      run: |
        sudo cp -R .build/app/Ayna.app /Applications/Ayna.app

    - name: Register app with Launch Services
      run: /System/Library/Frameworks/CoreServices.framework/Versions/A/Frameworks/LaunchServices.framework/Versions/A/Support/lsregister -f /Applications/Ayna.app

    - name: Run UI tests (with retry)
      run: |
        set -o pipefail
        for attempt in 1 2; do
          echo "Attempt $attempt of 2"
          if xcodebuild \
            -project AynaUITests.xcodeproj \
            -scheme AynaUITests \
            -destination 'platform=macOS' \
            -resultBundlePath ./build/TestResults-macOS-UI.xcresult \
            -retry-tests-on-failure \
            test; then
            echo "Tests passed on attempt $attempt"
            break
          fi
          if [ $attempt -lt 2 ]; then
            echo "Tests failed, retrying..."
            rm -rf ./build/TestResults-macOS-UI.xcresult
            sleep 5
          else
            echo "Tests failed after 2 attempts"
            exit 1
          fi
        done

    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: macOS-UI-TestResults
        path: ./build/*.xcresult
        retention-days: 7

  ios_ui_tests:
    name: iOS UI Tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Select Xcode version
      run: sudo xcode-select -s "$XCODE_APP/Contents/Developer"

    - name: Show Swift version
      run: swift --version

    - name: Clear SPM artifacts cache
      run: rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts

    - name: List available simulators
      run: |
        echo "Available iOS runtimes:"
        xcrun simctl list runtimes | grep -i ios || true
        echo "Available iOS devices:"
        xcrun simctl list devices available | grep -i iphone | head -20 || true

    - name: Prepare iOS Simulator
      run: |
        # Pick the last (latest runtime) device to avoid "multiple devices matched" errors
        DEVICE_UDID=$(xcrun simctl list devices available | grep "iPhone 17" | tail -1 | grep -oE '[A-F0-9-]{36}')
        echo "DEVICE_UDID=$DEVICE_UDID" >> "$GITHUB_ENV"
        echo "Preparing simulator: iPhone 17 ($DEVICE_UDID)"
        xcrun simctl shutdown "$DEVICE_UDID" 2>/dev/null || true
        sleep 3

    - name: Build iOS app
      run: |
        set -o pipefail
        xcodebuild \
          -project AynaMobile.xcodeproj \
          -scheme Ayna-iOS \
          -destination "id=$DEVICE_UDID" \
          -derivedDataPath ./build \
          -configuration Debug \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          build

    - name: Install iOS app on simulator
      run: |
        APP_PATH=$(find ./build -name "Ayna.app" -path "*/Debug-iphonesimulator/*" | head -1)
        xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
        xcrun simctl bootstatus "$DEVICE_UDID" -b 2>/dev/null || sleep 5
        xcrun simctl install "$DEVICE_UDID" "$APP_PATH"

    - name: Run iOS UI tests (with retry)
      run: |
        set -o pipefail
        for attempt in 1 2; do
          echo "Attempt $attempt of 2"
          if xcodebuild \
            -project AynaUITests.xcodeproj \
            -scheme AynaIOSUITests \
            -destination "id=$DEVICE_UDID" \
            -resultBundlePath ./build/TestResults-iOS-UI.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -retry-tests-on-failure \
            test; then
            echo "Tests passed on attempt $attempt"
            break
          fi
          if [ $attempt -lt 2 ]; then
            echo "Tests failed, retrying..."
            rm -rf ./build/TestResults-iOS-UI.xcresult
            sleep 5
          else
            echo "Tests failed after 2 attempts"
            exit 1
          fi
        done

    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: iOS-UI-TestResults
        path: ./build/*.xcresult
        retention-days: 7

  watchos_ui_tests:
    name: watchOS UI Tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Select Xcode version
      run: sudo xcode-select -s "$XCODE_APP/Contents/Developer"

    - name: Show Swift version
      run: swift --version

    - name: Clear SPM artifacts cache
      run: rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts

    - name: List available simulators
      run: |
        echo "Available watchOS runtimes:"
        xcrun simctl list runtimes | grep -i watch || true
        echo "Available watchOS devices:"
        xcrun simctl list devices available | grep -i watch | head -20 || true

    - name: Prepare watchOS Simulator
      run: |
        # Pick the last (latest runtime) device to avoid "multiple devices matched" errors
        DEVICE_UDID=$(xcrun simctl list devices available | grep "Apple Watch Ultra 3 (49mm)" | tail -1 | grep -oE '[A-F0-9-]{36}')
        echo "DEVICE_UDID=$DEVICE_UDID" >> "$GITHUB_ENV"
        echo "Preparing simulator: Apple Watch Ultra 3 ($DEVICE_UDID)"
        xcrun simctl shutdown "$DEVICE_UDID" 2>/dev/null || true
        sleep 3

    - name: Build watchOS app
      run: |
        set -o pipefail
        xcodebuild \
          -project AynaMobile.xcodeproj \
          -scheme Ayna-watchOS \
          -destination "id=$DEVICE_UDID" \
          -derivedDataPath ./build \
          -configuration Debug \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          build

    - name: Install watchOS app on simulator
      run: |
        APP_PATH=$(find ./build -name "Ayna Watch App.app" -path "*/Debug-watchsimulator/*" | head -1)
        xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
        xcrun simctl bootstatus "$DEVICE_UDID" -b 2>/dev/null || sleep 5
        xcrun simctl install "$DEVICE_UDID" "$APP_PATH"

    - name: Run watchOS UI tests (with retry)
      run: |
        set -o pipefail
        for attempt in 1 2; do
          echo "Attempt $attempt of 2"
          if xcodebuild \
            -project AynaUITests.xcodeproj \
            -scheme AynaWatchOSUITests \
            -destination "id=$DEVICE_UDID" \
            -resultBundlePath ./build/TestResults-watchOS-UI.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -retry-tests-on-failure \
            test; then
            echo "Tests passed on attempt $attempt"
            break
          fi
          if [ $attempt -lt 2 ]; then
            echo "Tests failed, retrying..."
            rm -rf ./build/TestResults-watchOS-UI.xcresult
            sleep 5
          else
            echo "Tests failed after 2 attempts"
            exit 1
          fi
        done

    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: watchOS-UI-TestResults
        path: ./build/*.xcresult
        retention-days: 7
