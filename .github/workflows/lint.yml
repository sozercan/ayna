name: SwiftLint

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - '**.swift'
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - '.swiftlint.yml'
      - '.swiftformat'
      - '.github/workflows/lint.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**.swift'
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - '.swiftlint.yml'
      - '.swiftformat'
      - '.github/workflows/lint.yml'

env:
  XCODE_APP: /Applications/Xcode_26.2.app
  # Keep in step with --minversion in .swiftformat.
  SWIFTFORMAT_VERSION: 0.64.6
  SWIFTFORMAT_SHA256: 70e6b2057647fb1c54d620ebbb6649274de56534c57f91f67461a129ebaaba3e

jobs:
  lint:
    runs-on: macos-26
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Select Xcode version
      run: sudo xcode-select -s "$XCODE_APP/Contents/Developer"

    - name: Install SwiftLint
      run: brew install swiftlint

    - name: Run SwiftLint
      run: |
        swiftlint lint --strict --reporter github-actions-logging

  format:
    runs-on: macos-26
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install SwiftFormat
      run: |
        curl -sSfL -o "$RUNNER_TEMP/swiftformat.zip" \
          "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip"
        echo "$SWIFTFORMAT_SHA256  $RUNNER_TEMP/swiftformat.zip" | shasum -a 256 -c -
        unzip -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
        echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"

    - name: Check formatting
      run: swiftformat --lint . --reporter github-actions-log
