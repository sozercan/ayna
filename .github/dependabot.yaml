version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-all:
        patterns:
        - "*"
  # Keeps the committed Package.resolved (Sparkle) current.
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
